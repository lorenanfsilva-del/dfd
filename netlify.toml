[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Redirecionamento da API de pagamento
[[redirects]]
  from = "/api/create-pix"
  to = "/.netlify/functions/create-pix"
  status = 200

[[redirects]]
  from = "/api/check-pix"
  to = "/.netlify/functions/check-pix"
  status = 200

# Redirecionamentos amigáveis das rotas do funil
[[redirects]]
  from = "/2/*"
  to = "/345349787234/2/:splat"
  status = 200

